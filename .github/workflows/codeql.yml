name: "KMP Security Pipeline"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-scan:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Set up JDK 21 environment required for modern Kotlin compilation
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies for faster runs

    # The Android target will not configure without an SDK, and the runner image has no SDK 37.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-37.0 platforms;android-37.1 build-tools;37.0.0'

    # Run open-source detekt across all KMP targets via Gradle
    - name: Run detekt Code Quality Scan
      run: |
        chmod +x ./gradlew
        ./gradlew detekt

    # Snyk needs a token. Without one these steps fail on authentication rather than on anything
    # about this code, so they run only when the secret is actually configured.
    - name: Check for Snyk credentials
      id: snyk
      run: echo "configured=${{ secrets.SNYK_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

    # SAST over the source. `snyk code test` does not need a resolved dependency graph, so it does
    # not need Gradle -- the previous `snyk test` did, and failed trying to run it.
    - name: Run Snyk Code Security Scan
      if: steps.snyk.outputs.configured == 'true'
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: code test
        args: --severity-threshold=high

    # SCA over the dependency graph. This one does run Gradle, so it needs a JDK *inside* the
    # container: snyk/actions/gradle inherits JAVA_HOME from the host, where the path does not
    # exist in the image, and every run died with "JAVA_HOME is set to an invalid directory".
    # The jdk21 image ships its own.
    - name: Run Snyk Dependency Scan
      if: steps.snyk.outputs.configured == 'true'
      uses: snyk/actions/gradle-jdk21@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
