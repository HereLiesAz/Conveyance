name: "KMP Security Pipeline"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-scan:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Set up JDK 21 environment required for modern Kotlin compilation
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Automatically caches Gradle dependencies for faster runs

    # Run open-source detekt across all KMP targets via Gradle
    - name: Run detekt Code Quality Scan
      run: |
        chmod +x ./gradlew
        ./gradlew detekt

    # Run free Snyk scan for custom source code security vulnerabilities (SAST)
    - name: Run Snyk Code Security Scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --code-quality-threshold=high

    # Run Snyk to monitor and check for vulnerable multiplatform dependencies (SCA)
    - name: Run Snyk Dependency Scan
      uses: snyk/actions/gradle@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: monitor
